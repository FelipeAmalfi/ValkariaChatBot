name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Install → Typecheck → Test → Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Required for Next.js build — values don't need to be real in CI
          NEXT_PUBLIC_API_URL: https://valkaria-api.onrender.com
          NEXT_PUBLIC_GRAPHQL_URL: https://valkaria-api.onrender.com/graphql
