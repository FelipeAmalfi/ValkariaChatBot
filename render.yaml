services:
  - type: web
    name: valkaria-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w @valkaria/shared && npm run build -w @valkaria/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    autoDeploy: false  # Controlled by GitHub Actions deploy hook

    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_HOST
        value: 0.0.0.0

      # Set these in the Render dashboard (sensitive values)
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DM_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
