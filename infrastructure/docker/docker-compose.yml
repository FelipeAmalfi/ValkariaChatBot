services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: valkaria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: valkaria
      POSTGRES_PASSWORD: valkaria
      POSTGRES_DB: valkaria_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U valkaria -d valkaria_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - valkaria_network

  redis:
    image: redis:7-alpine
    container_name: valkaria_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - valkaria_network

  neo4j:
    image: neo4j:5.15
    container_name: valkaria_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/valkaria123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ['CMD', 'cypher-shell', '-u', 'neo4j', '-p', 'valkaria123', 'RETURN 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - valkaria_network

volumes:
  postgres_data:
    name: valkaria_postgres_data
  redis_data:
    name: valkaria_redis_data
  neo4j_data:
    name: valkaria_neo4j_data
  neo4j_logs:
    name: valkaria_neo4j_logs

networks:
  valkaria_network:
    name: valkaria_network
    driver: bridge
